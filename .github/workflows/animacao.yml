# Gera a animação do campo minado nas contribuições e publica no ramo "output" (o README usa a imagem de lá).
# As automações de terceiros ficam presas a uma versão exata (o código daquele dia), não a uma que muda sozinha.
# Roda todo dia e também dá para rodar na mão (Actions › Campo minado › Run workflow).
name: Campo minado

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1 # main em 2026-11-13
        with:
          github_user_name: ${{ github.repository_owner }}
          games: minesweeper

      - uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

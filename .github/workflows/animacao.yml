# Gera a cobrinha comendo as contribuições, em degradê preto e branco, e publica no ramo "output" (o README usa a
# imagem de lá). Quadradinhos: do cinza bem escuro (sem contribuição) ao branco (mais contribuições); cobra branca.
# As automações de terceiros ficam presas a uma versão exata (o código daquele dia), não a uma que muda sozinha.
# Roda todo dia e também dá para rodar na mão (Actions › Cobrinha › Run workflow).
name: Cobrinha

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#ffffff&color_dots=#161b22,#3d3d3d,#707070,#a8a8a8,#ffffff

      - uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<style>.l{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;fill:#8b949e} .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:600;fill:#fff} .d{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13.5px;fill:#c9d1d9} .c{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;fill:#e6edf3} .sn{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:700;fill:#fff} .sl{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:11.5px;fill:#8b949e} .in{animation:in .6s ease both} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>

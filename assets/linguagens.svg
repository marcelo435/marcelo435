<svg xmlns="http://www.w3.org/2000/svg" width="430" height="360" viewBox="0 0 430 360" role="img" aria-label="Linguagens">
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:600;fill:#ffffff}
  .s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;fill:#8b949e}
  .n{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#e6edf3}
  .v{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#8b949e}
  .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
  .dot{animation:fade .4s ease both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="429" height="359" rx="10" fill="#000000" stroke="#30363d"/>
<text x="24" y="38" class="t">Linguagens</text>
<text x="24" y="58" class="s">parte de cada uma no código que escrevi</text>
<text x="24" y="92" class="n">TypeScript</text><text x="406" y="92" class="v" text-anchor="end">62%</text><rect x="24" y="100" width="382" height="6" rx="3" fill="#21262d"/><rect class="bar" style="animation-delay:0.0s" x="24" y="100" width="235" height="6" rx="3" fill="#ffffff"/>
<text x="24" y="126" class="n">JavaScript</text><text x="406" y="126" class="v" text-anchor="end">20%</text><rect x="24" y="134" width="382" height="6" rx="3" fill="#21262d"/><rect class="bar" style="animation-delay:0.1s" x="24" y="134" width="74" height="6" rx="3" fill="#e6e6e6"/>

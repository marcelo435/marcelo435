<text x="24" y="194" class="n">CSS</text><text x="406" y="194" class="v" text-anchor="end">4%</text><rect x="24" y="202" width="382" height="6" rx="3" fill="#21262d"/><rect class="bar" style="animation-delay:0.3s" x="24" y="202" width="17" height="6" rx="3" fill="#b3b3b3"/>
<text x="24" y="228" class="n">Astro</text><text x="406" y="228" class="v" text-anchor="end">1%</text><rect x="24" y="236" width="382" height="6" rx="3" fill="#21262d"/><rect class="bar" style="animation-delay:0.4s" x="24" y="236" width="5" height="6" rx="3" fill="#999999"/>
